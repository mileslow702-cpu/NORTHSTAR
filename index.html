<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<title>North Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen arcade cabinet. Game canvas centered on a dark field, touch pad underneath on phones. */
:root{
  --bg:#07060f;
  --fg:#f3ead8;
  --accent:#ffcc33;
  --dim:#7a7199;
  --pad:#1b1730;
  --pad-edge:#3a3260;
  --font-pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-pixel);
  margin:0;padding-inline:16px;padding-block:16px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.stage{position:relative;line-height:0;max-width:100%;box-shadow:0 0 0 3px #000,0 0 0 5px var(--pad-edge),0 18px 50px rgba(0,0,0,.65)}
canvas{display:block;max-width:100%;image-rendering:pixelated;touch-action:none;cursor:pointer}
.crt{position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.16) 2px 3px),
    radial-gradient(ellipse at center,rgba(0,0,0,0) 62%,rgba(0,0,0,.45) 100%)}
.hint{font-size:9px;letter-spacing:.08em;color:var(--dim);text-align:center;line-height:1.8}
.hint b{color:var(--accent);font-weight:400}
.pad{display:none;width:100%;max-width:520px;justify-content:space-between;align-items:center;gap:12px;touch-action:none}
.pad .dir{display:flex;gap:12px}
.pad button{
  font:inherit;font-size:11px;color:var(--fg);background:var(--pad);
  border:2px solid var(--pad-edge);border-bottom-width:5px;border-radius:10px;
  width:68px;height:62px;display:grid;place-items:center;touch-action:none;padding:0;
}
.pad button.jump{width:96px;background:#3a1f2a;border-color:#e8413c;color:var(--accent)}
.pad button.on{transform:translateY(2px);border-bottom-width:3px;filter:brightness(1.3)}
.pad svg{width:22px;height:22px;fill:currentColor}
@media (pointer:coarse){.pad{display:flex}.hint{display:none}}
</style>
</head>
<body>


<div class="stage"><canvas id="game" width="1280" height="768" aria-label="North Star game screen"></canvas><div class="crt"></div></div>
<div class="hint"><b>← →</b> OR <b>A D</b> MOVE &nbsp;·&nbsp; <b>SPACE</b> JUMP / CLIMB &nbsp;·&nbsp; <b>ENTER</b> START</div>
<div class="pad">
  <div class="dir">
    <button id="btn-left" data-k="left" aria-label="Move left"><svg viewBox="0 0 10 10"><path d="M7 1 2 5l5 4z"/></svg></button>
    <button id="btn-right" data-k="right" aria-label="Move right"><svg viewBox="0 0 10 10"><path d="M3 1l5 4-5 4z"/></svg></button>
  </div>
  <button id="btn-jump" class="jump" data-k="jump" aria-label="Jump">JUMP</button>
</div>

<script>
(() => {
"use strict";
const W = 320, H = 192, T = 16, ROWS = 12;
const SCALE = 4; // canvas renders at 4x the game grid so the Higgsfield art keeps full detail
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
cv.width = W * SCALE; cv.height = H * SCALE;
ctx.imageSmoothingEnabled = false;
const FONT = '"Press Start 2P", ui-monospace, monospace';
const TOUCH = matchMedia('(pointer:coarse)').matches;
document.fonts && document.fonts.load('8px "Press Start 2P"').catch(() => {});

/* ---------------- sizing ---------------- */
const pad = document.querySelector('.pad'), hint = document.querySelector('.hint');
function resize() {
  const extra = (pad.offsetParent ? pad.offsetHeight + 14 : 0) + (hint.offsetParent ? hint.offsetHeight + 14 : 0);
  const availW = document.body.clientWidth - 32 - 10;
  const availH = window.innerHeight - extra - 32 - 10;
  let s = Math.min(availW / W, availH / H);
  if (s >= 2) s = Math.floor(s);
  s = Math.max(s, 0.5);
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
  cv.style.imageRendering = W * s * (window.devicePixelRatio || 1) >= W * SCALE ? 'pixelated' : 'auto';
}
addEventListener('resize', resize);
resize();

/* ---------------- helpers ---------------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const pad2 = n => String(n).padStart(2, '0');
const snap = v => Math.round(v * SCALE) / SCALE;
function text(s, x, y, col = '#f3ead8', size = 8, align = 'left', shadow = '#000') {
  ctx.font = size + 'px ' + FONT; ctx.textAlign = align; ctx.textBaseline = 'top';
  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(s, x + 1, y + 1); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function wrap(s, n) {
  const out = []; let line = '';
  for (const w of s.split(' ')) { if ((line + ' ' + w).trim().length > n) { out.push(line.trim()); line = w; } else line += ' ' + w; }
  if (line.trim()) out.push(line.trim());
  return out;
}
function rect(col, x, y, w, h) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function glow(x, y, r, col, a) { ctx.globalAlpha = a; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }

/* ---------------- audio ---------------- */
let ac = null;
function audioOn() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(f1, f2, dur, type = 'square', vol = 0.06, delay = 0) {
  if (!ac) return;
  const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {
  jump: () => tone(260, 560, 0.12, 'square', 0.045),
  coin: () => { tone(988, null, 0.07, 'square', 0.045); tone(1319, null, 0.2, 'square', 0.045, 0.07); },
  star: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, null, 0.12, 'triangle', 0.09, i * 0.06)),

  stomp: () => tone(240, 70, 0.14, 'square', 0.06),

  select: () => tone(660, null, 0.05, 'square', 0.04),

/* ---------------- images (all Higgsfield art, watermark removed) ---------------- */

const IMG = {}; let loaded = 0; const toLoad = Object.keys(IMG_SRC).length;

const BG_W = {"studio": 1380, "fremont": 1476, "arts": 1392, "westside": 1384, "strip": 1376}; // background widths in screen pixels
const sprW = n => AR[n][2] / SCALE, sprH = n => AR[n][3] / SCALE;
function spr(n, x, y, flip) {
  if (!ready(IMG.atlas)) return;
  const r = AR[n], w = r[2] / SCALE, h = r[3] / SCALE;
  if (flip) { ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(IMG.atlas, r[0], r[1], r[2], r[3], 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(IMG.atlas, r[0], r[1], r[2], r[3], x, y, w, h);
}
const sprC = (n, cx, cy, flip) => spr(n, snap(cx - sprW(n) / 2), snap(cy - sprH(n) / 2), flip);
const sprFeet = (n, cx, feet, flip) => spr(n, snap(cx - sprW(n) / 2), snap(feet - sprH(n)), flip);

/* Miles: 7 frames of 52x76 art pixels, each drawn as half a game pixel */
const MCW = 52, MCH = 76, MDW = MCW * 0.68, MDH = MCH * 0.68; // ~52 game pixels tall
const MF = { idle: 0, run1: 1, run2: 2, run3: 3, run4: 4, jump: 5, hurt: 6 };
const RUN_CYCLE = [MF.run1, MF.run4, MF.run3, MF.run4];
function drawMiles(f, cx, feetY, face) {
  if (!ready(IMG.miles)) return;
  const x = snap(cx - MDW / 2), y = snap(feetY - MDH);
  if (face < 0) { ctx.save(); ctx.translate(x + MDW, y); ctx.scale(-1, 1); ctx.drawImage(IMG.miles, f * MCW, 0, MCW, MCH, 0, 0, MDW, MDH); ctx.restore(); }
  else ctx.drawImage(IMG.miles, f * MCW, 0, MCW, MCH, x, y, MDW, MDH);
}

/* small code-drawn HUD icons */
function sprite(rows, pal) {
  const c = document.createElement('canvas'); c.width = rows[0].length; c.height = rows.length;
  const x = c.getContext('2d');
  rows.forEach((r, j) => [...r].forEach((ch, i) => { if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, j, 1, 1); } }));
  return c;
}
const MSTAR = ['...Y...', '...Y...', '..YWY..', 'YYWWWYY', '..YWY..', '...Y...', '...Y...'];
const NSTAR = ['.....Y.....', '.....Y.....', '....YYY....', '....YWY....', '..YYYWYYY..', 'YYYYWWWYYYY', '..YYYWYYY..', '....YWY....', '....YYY....', '.....Y.....', '.....Y.....'];
const SPR = {
  mstar: sprite(MSTAR, { Y: '#ffd84a', W: '#fffbe0' }), mstarOff: sprite(MSTAR, { Y: '#3a3358', W: '#4a4370' }),
  bigStar: sprite(NSTAR, { Y: '#fffbe0', W: '#ffffff' }),
  key: sprite(['CCCCCCCCCCCC', 'CggCCCCCCCCC', 'CggCCccccCCC', 'CCCCCCCCCCCC', 'CCCCCccccccC', 'CCCCCCCCCCCC', 'cccccccccccc'], { C: '#3ee6ff', c: '#178aa8', g: '#ffcc33' }),
  heart: sprite(['.RR.RR.', 'RRRRRRR', 'RRRRRRR', '.RRRRR.', '..RRR..', '...R...'], { R: '#e8413c' }),
};

/* ---------------- tiles per theme (bricks, used blocks, platforms) ---------------- */
const THEMES = {
  studio: { mortar: '#1a0c18', brick: '#4a1f3a', brickHi: '#6d2e55' },
  fremont: { mortar: '#3a1a1e', brick: '#a64b3c', brickHi: '#c9654f' },
  arts: { mortar: '#2e2220', brick: '#7d5640', brickHi: '#a0704f' },

  strip: { mortar: '#1e1430', brick: '#5b3a8a', brickHi: '#7d55b5' },
};
const PLANKS = {
  studio: R => { R('#2a2438', 0, 0, 16, 5); R('#4a4560', 0, 0, 16, 1); R('#120e1d', 0, 5, 16, 1); for (let i = 2; i < 16; i += 5) R('#ff3b5c', i, 2, 2, 1); },
  fremont: R => { R('#7a4e0a', 0, 0, 16, 6); R('#ffcc33', 0, 0, 16, 1); R('#c98f12', 0, 5, 16, 1); for (let i = 1; i < 16; i += 4) R('#fff2a8', i, 2, 2, 2); },
  arts: R => { R('#9a6a3e', 0, 0, 16, 2); R('#5a3a20', 0, 2, 16, 1); R('#9a6a3e', 0, 3, 16, 2); R('#3e2814', 0, 5, 16, 1); R('#3e2814', 0, 0, 1, 6); R('#3e2814', 8, 0, 1, 6); },
  westside: R => { for (let i = 0; i < 16; i += 4) R((i / 4) % 2 ? '#f3ead8' : '#c8323c', i, 0, 4, 5); R('#5a1820', 0, 5, 16, 1); },
  strip: R => { R('#3ee6ff', 0, 0, 16, 1); R('#1a1530', 0, 1, 16, 4); R('#ff3fa4', 0, 5, 16, 1); for (let i = 1; i < 16; i += 4) R('#fff2a8', i, 3, 1, 1); },
};
function makeTiles(name) {
  const C = THEMES[name];
  const mk = fn => { const c = document.createElement('canvas'); c.width = c.height = 16; const x = c.getContext('2d'); fn((col, a, b, w, h) => { x.fillStyle = col; x.fillRect(a, b, w, h); }); return c; };
  return {
    brick: mk(R => { R(C.mortar, 0, 0, 16, 16); for (let r = 0; r < 4; r++) { const off = r % 2 ? 4 : 0; for (let k = -1; k < 2; k++) { const bx = k * 8 + off; R(C.brick, bx + 1, r * 4 + 1, 7, 3); R(C.brickHi, bx + 1, r * 4 + 1, 7, 1); } } }),

}
const TILES = {}; for (const k in THEMES) TILES[k] = makeTiles(k);

/* ---------------- side-scrolling levels ----------------

function mk(w, name, theme) {
  const g = []; for (let y = 0; y < ROWS; y++) g.push(Array(w).fill('.'));
  const L = { kind: 'side', w, name, theme, g, coins: [], stars: [], ups: [], safes: [], crowd: [], key: null, door: null, enemies: [], start: { x: 2 }, keyName: 'KEY CARD', doorType: 'exit' };
  const api = {
    ground: (a, b) => { for (let x = a; x <= b; x++) { g[10][x] = '#'; g[11][x] = '#'; } },
    row: (x, y, s) => [...s].forEach((c, i) => { if (c !== ' ') g[y][x + i] = c; }),
    plat: (x, y, n) => { for (let i = 0; i < n; i++) g[y][x + i] = '-'; },
    col: (x, top) => { for (let y = top; y <= 9; y++) g[y][x] = 'B'; },
    coins: (x, y, n) => { for (let i = 0; i < n; i++) L.coins.push({ x: x + i, y }); },
    coin: (x, y) => L.coins.push({ x, y }),
    star: (x, y) => L.stars.push({ x, y }),

}

const LEVELS = [

  }
  if (state === 'clear') {
    drawCover(IMG.scene_clear, 0.3);
    for (const c of rain) sprC(COIN_FRAMES[Math.floor(t * 8 + c.ph) % 4], c.x, c.y);
    const n = Math.min(18, 5 + levelIndex * 4);
    for (let k = 0; k < n; k++) drawPerson(k, 14 + k * (292 / (n - 1 || 1)), 190);
    panel(40, 24, 240, 92);
    text('LEVEL CLEAR', W / 2, 34, '#4dff7a', 16, 'center');
    text(CLEAR_LINES[levelIndex] || '', W / 2, 58, '#f3ead8', 8, 'center');
    text('COINS ' + pad2(lv.coinsGot) + '/' + pad2(lv.coinsTotal) + '   MASTERS ' + masters + '/7', W / 2, 76, '#ffcc33', 8, 'center');
    if (blink() && stateT > 1) text('JUMP TO CONTINUE', W / 2, 96, '#3ee6ff', 8, 'center');
    return;
  }
  if (lv.kind === 'side') drawWorldSide(); else drawWorldClimb();
  hud();
  if (state === 'intro') {
    rect('rgba(5,4,15,.72)', 0, 0, W, H);
    text(levelIndex >= 4 ? (lv.stage ? 'FINAL LEVEL · PART 2' : 'FINAL LEVEL · PART 1') : 'LEVEL ' + (levelIndex + 1), W / 2, 50, '#a99bc2', 8, 'center');
    text(lv.name, W / 2, 66, '#ffcc33', 16, 'center');
    lv.intro.forEach((l, i) => text(l, W / 2, 98 + i * 14, i === 0 ? '#3ee6ff' : '#cfc3e0', 8, 'center'));
  } else if (state === 'over') {
    rect('rgba(5,4,15,.8)', 0, 0, W, H);
    if (continues > 0) {
      text('OUT OF LIVES', W / 2, 40, '#e8413c', 16, 'center');
      text(continues === 2 ? 'TAKE YOUR SECOND CHANCE?' : 'THIS IS YOUR FINAL CHANCE', W / 2, 66, '#cfc3e0', 8, 'center');
      [['CONTINUE', 'THIS LEVEL'], ['START OVER', 'LEVEL 1']].forEach((o, i) => {
        const x = i === 0 ? 40 : 172, sel = dealPick === i;
        panel(x, 96, 108, 40, sel ? '#ffcc33' : '#3a3260');
        text(o[0], x + 54, 106, sel ? '#ffcc33' : '#a99bc2', 8, 'center'); text(o[1], x + 54, 120, '#7a7199', 8, 'center');
        if (sel && blink()) text('▸', x - 10, 112, '#ffcc33', 8, 'left', null);
      });
      text('← → CHOOSE · JUMP TO DECIDE', W / 2, 160, '#cfc3e0', 8, 'center');
    } else {
      text('GAME OVER', W / 2, 70, '#e8413c', 16, 'center');
      text('BACK TO THE BEGINNING', W / 2, 96, '#cfc3e0', 8, 'center');
      if (blink() && stateT > 1.5) text(PRESS(), W / 2, 120, '#f3ead8', 8, 'center');
    }
  } else if (state === 'play' && lv.kind === 'climb' && lv.boss.dead) {
    text('THE CEO IS DOWN', W / 2, 30, '#ffcc33', 8, 'center');
  } else if (state === 'play' && lv.kind === 'climb' && lv.boss.gone) {
    text('HE TOOK THE ELEVATOR UP!', W / 2, 30, '#ff6b6b', 8, 'center');
  }
}

/* ---------------- input ---------------- */
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump' };
function choose(k) { if ((state === 'deal' || (state === 'over' && continues > 0)) && (k === 'left' || k === 'right')) { dealPick = k === 'left' ? 0 : 1; sfx.select(); } }
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k || e.code === 'Enter') e.preventDefault();
  audioOn();
  if (e.repeat) return;
  if (k) { keys[k] = true; if (k === 'jump') jumpPressed = true; choose(k); }
  if (k === 'jump' || e.code === 'Enter') startPressed = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; });
document.querySelectorAll('.pad button').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); audioOn(); keys[k] = true; b.classList.add('on'); choose(k); if (k === 'jump') { jumpPressed = true; startPressed = true; } };
  const up = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
cv.addEventListener('pointerdown', () => { audioOn(); if (state !== 'play') startPressed = true; });

/* ---------------- loop ---------------- */
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
function boot(data) {
  if (data && data.inGame) {
    lives = data.lives; totals = data.totals; masters = data.masters; levelIndex = data.levelIndex; continues = data.continues ?? 2; coinBank = data.coinBank ?? 0;
    loadLevel(levelIndex); state = 'intro'; stateT = 0;
  }
  requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(frame); });
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ inGame: ['intro', 'play', 'dead', 'clear'].includes(state), levelIndex, lives, totals, masters, continues, coinBank }));
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
/*__TEST_HOOK__*/
})();
</script>
