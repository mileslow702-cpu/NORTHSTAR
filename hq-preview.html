<meta charset="utf-8">
<title>North Star HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* HQ layout preview: walkable top-down room. Placeholder shapes stand in for the Higgsfield art. */
:root{--bg:#07060f;--fg:#f3ead8;--accent:#ffcc33;--dim:#7a7199;--pad:#1b1730;--pad-edge:#3a3260;--font:"Press Start 2P",ui-monospace,monospace;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
html,body{height:100%}
body{margin:0;padding:16px;box-sizing:border-box;background:var(--bg);color:var(--fg);font-family:var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.stage{position:relative;line-height:0;max-width:100%;box-shadow:0 0 0 3px #000,0 0 0 5px var(--pad-edge),0 18px 50px rgba(0,0,0,.65)}
canvas{display:block;max-width:100%;image-rendering:pixelated;touch-action:none}
.hint{font-size:9px;letter-spacing:.08em;color:var(--dim);text-align:center;line-height:1.9}
.hint b{color:var(--accent);font-weight:400}
.tag{font-size:8px;letter-spacing:.14em;color:#3ee6ff}
.pad{display:none;width:100%;max-width:520px;justify-content:space-between;align-items:center;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,52px);gap:4px}
.pad button{font:inherit;font-size:11px;color:var(--fg);background:var(--pad);border:2px solid var(--pad-edge);border-bottom-width:5px;border-radius:10px;display:grid;place-items:center;padding:0;touch-action:none}
.pad button.on{transform:translateY(2px);border-bottom-width:3px;filter:brightness(1.3)}
.pad svg{width:20px;height:20px;fill:currentColor}
.dpad [data-k=up]{grid-area:1/2}.dpad [data-k=left]{grid-area:2/1}.dpad [data-k=right]{grid-area:2/3}.dpad [data-k=down]{grid-area:3/2}
.pad .act{width:84px;height:84px;border-radius:50%;background:#3a1f2a;border-color:#e8413c;color:var(--accent);font-size:16px}
@media (pointer:coarse){.pad{display:flex}.hint .keys{display:none}}
/* station panels */
.panel{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(5,4,15,.72);-webkit-user-select:text;user-select:text}
.panel[hidden]{display:none}
.card{position:relative;width:min(460px,100%);max-height:calc(100vh - 32px);overflow-y:auto;box-sizing:border-box;background:#100c22;border:3px solid var(--accent);border-radius:12px;padding:22px 18px 18px;box-shadow:0 0 0 3px #000,0 24px 60px rgba(0,0,0,.7)}
.card h2{margin:0 0 6px;font-weight:400;font-size:14px;line-height:1.6;color:var(--accent);text-shadow:3px 3px 0 #3a1030}
.card .sub{margin:0 0 16px;font-family:var(--sans);font-size:14px;line-height:1.5;color:#cfc3e0}
.x{position:absolute;top:6px;right:6px;width:40px;height:40px;background:none;border:0;color:#a99bc2;cursor:pointer;padding:10px}
.x svg{width:100%;height:100%;stroke:currentColor;stroke-width:2.6}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rows li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:2px solid #3a3260;border-radius:8px;font-size:9px;line-height:1.6;letter-spacing:.06em}
.rows li small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:0;color:#a99bc2;margin-top:3px}
.rows li.lock{opacity:.5}
.btn{font:inherit;font-size:9px;letter-spacing:.06em;color:#100c22;background:var(--accent);border:0;border-bottom:3px solid #b8860b;border-radius:6px;padding:9px 11px;cursor:pointer;white-space:nowrap;text-decoration:none;flex:none}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--pad-edge)}
.btn:focus-visible,.x:focus-visible{outline:2px solid #3ee6ff;outline-offset:2px}
.yt{position:relative;width:100%;aspect-ratio:16/9;margin-bottom:12px;border-radius:8px;overflow:hidden;background:#000}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.card video{width:100%;border-radius:8px;display:block;margin-bottom:12px;background:#000}
.card img.wide{width:100%;border-radius:8px;display:block;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{border:2px solid #3a3260;border-radius:8px;padding:10px 4px;text-align:center;font-size:7px;letter-spacing:.1em;color:#a99bc2;line-height:2}
.stats b{display:block;font-weight:400;font-size:13px;color:var(--accent)}
</style>

<div class="tag">HQ LAYOUT PREVIEW · PLACEHOLDER ART</div>
<div class="stage"><canvas id="hq" width="1280" height="768" aria-label="North Star HQ"></canvas></div>
<div class="hint"><span class="keys"><b>ARROWS / WASD</b> WALK &nbsp;·&nbsp; <b>SPACE / ENTER</b> USE &nbsp;·&nbsp; <b>ESC</b> CLOSE<br></span>WALK UP TO ANYTHING THAT GLOWS</div>
<div class="pad">
  <div class="dpad">
    <button data-k="up" aria-label="Walk up"><svg viewBox="0 0 10 10"><path d="M1 7l4-5 4 5z"/></svg></button>
    <button data-k="left" aria-label="Walk left"><svg viewBox="0 0 10 10"><path d="M7 1 2 5l5 4z"/></svg></button>
    <button data-k="right" aria-label="Walk right"><svg viewBox="0 0 10 10"><path d="M3 1l5 4-5 4z"/></svg></button>
    <button data-k="down" aria-label="Walk down"><svg viewBox="0 0 10 10"><path d="M1 3l4 5 4-5z"/></svg></button>
  </div>
  <button class="act" data-k="act" aria-label="Use">A</button>
</div>
<div class="panel" id="panel" hidden role="dialog" aria-modal="true"><div class="card" id="card"></div></div>

<script>
(() => {
"use strict";
const W = 320, H = 192, T = 16, SCALE = 4;
const cv = document.getElementById('hq'), ctx = cv.getContext('2d');
const TOUCH = matchMedia('(pointer:coarse)').matches;
const FONT = '"Press Start 2P", monospace';
ctx.imageSmoothingEnabled = false;

function resize() {
  const pad = document.querySelector('.pad'), extra = (pad.offsetParent ? pad.offsetHeight + 14 : 0) + 70;
  let s = Math.min((document.body.clientWidth - 42) / W, (innerHeight - extra - 42) / H);
  if (s >= 2) s = Math.floor(s);
  cv.style.width = Math.round(W * s) + 'px'; cv.style.height = Math.round(H * s) + 'px';
}
addEventListener('resize', resize); resize();

/* ---------- content (swap in Miles's real lists) ---------- */
const SONGS = [
  { title: 'Blame the Weather Man', src: 'audio/jukebox/blame-the-weather-man.mp3' },
  { title: 'Badu', src: 'audio/jukebox/badu.mp3' },
  { title: 'Like That', credit: 'Noize', src: 'audio/jukebox/like-that.mp3' },
];
const MP4 = document.createElement('video').canPlayType('video/mp4; codecs="avc1.42E01E"') !== '';
const VIDEOS = [   // YouTube
  { id: 'pIt_MtMWGkc', title: 'Las Vegas Shade 45 Cypher', sub: 'Punch Line Academy freestyle' },
  { id: 'xn-gWWTgbrw', title: 'Unexpected: Up Next', sub: 'Miles Low' },
  { id: 'SbrYtrhsqqU', title: '5th Element Hip Hop Show', sub: 'Miles Low x Vic Smith' },
];
const CARD_VIDEO = MP4 ? 'images/society-card.mp4' : 'images/society-card.webm';
const CREW = [
  { name: 'PRODUCER 1', role: 'Producer', note: 'Name, credits, photo and links go here.', col: '#e8413c' },
  { name: 'PRODUCER 2', role: 'Producer', note: 'Name, credits, photo and links go here.', col: '#3ee6ff' },
  { name: 'FEATURE 1', role: 'Featured artist', note: 'Name, song, photo and links go here.', col: '#4dff7a' },
  { name: 'FEATURE 2', role: 'Featured artist', note: 'Name, song, photo and links go here.', col: '#c77dff' },
  { name: 'ENGINEER', role: 'Mix & master', note: 'Name, credits, photo and links go here.', col: '#ffcc33' },
];
const MERCH_URL = 'https://mileslowmusic.com';
const LEVELS = ['THE STUDIO', 'DOWNTOWN', 'HISTORIC WESTSIDE', 'THE STRIP', 'THE PENTHOUSE'];
const CHAPTERS = [['CHAPTER 2 · THE UNDERGROUND', 'Northtown · Boulder Highway · the Tunnels · Boss: THE CURATOR'],
  ['CHAPTER 3 · THE BOT FARMS', 'Los Angeles · Houston · Atlanta · New York · the Machine World · Boss: THE BOT FATHER'],
  ['CHAPTER 4 · THE COSMIC WAR', 'Space · Boss: ALGOL, THE DEMON STAR']];

/* ---------- the TV wall: each screen cycles frames from one of Miles's videos, like a barbershop TV ---------- */
// YouTube can't be drawn into the game picture, so the wall shows frames from each video; walking up plays the real thing.
const FRAMES = VIDEOS.map(v => ['1', '2', '3', 'hqdefault'].map(n => { const im = new Image(); im.src = 'https://i.ytimg.com/vi/' + v.id + '/' + n + '.jpg'; return im; }));
// The TV wall plays Miles's video files on every screen, with sound, the whole time you're in HQ.
// Add a file here for each video (YouTube can't play inside the game picture; it opens when you walk up to the wall).
const TV_REEL = MP4 ? [{ title: 'Punch Line Academy cypher', src: 'video/tv-1.mp4' }] : [{ title: 'North Star Society card', src: CARD_VIDEO }];
let reelIdx = 0, heard = false;
const tv = document.createElement('video');
tv.src = TV_REEL[0].src; tv.muted = true; tv.playsInline = true; tv.setAttribute('playsinline', ''); tv.volume = 0.5;
tv.loop = TV_REEL.length === 1;
tv.addEventListener('ended', () => { reelIdx = (reelIdx + 1) % TV_REEL.length; tv.src = TV_REEL[reelIdx].src; tv.play().catch(() => {}); });
tv.play().catch(() => {});
const songOn = () => jukeAudio && !jukeAudio.paused;
function tvSound() { tv.muted = !heard || songOn() || !panelEl.hidden && cardEl.querySelector('iframe') !== null; }
function firstGesture() { heard = true; tv.play().catch(() => {}); tvSound(); }   // browsers only allow sound after the first tap or key

/* ---------- rooms: walls come from the tile map, furniture from solid boxes ---------- */
// '#' wall, '.' floor. Stations are boxes you walk up to; "use" is the side you press A from.
const ROOMS = {
  hq: {
    img: 'images/hq-room.webp', w: 500, h: 279,
    // the floor you can walk on: back wall (with the step beside the elevator), side walls, front edge
    floor: [[26, 104], [264, 104], [264, 83], [465, 83], [486, 277], [3, 277]],
    // furniture you can't walk through (blocked all the way back to the wall, so Miles never ends up "behind" it)
    solids: [
      { x: 19, y: 82, w: 43, h: 73 },    // jukebox
      { x: 247, y: 101, w: 15, h: 13 },  // floor lamp
      { x: 264, y: 82, w: 15, h: 10 },   // floor lamp
      { x: 310, y: 82, w: 124, h: 54 },  // couch
      { x: 447, y: 82, w: 20, h: 37 },   // side table and lamp
      { x: 72, y: 217, w: 137, h: 62 },  // arcade cabinets
      { x: 392, y: 210, w: 87, h: 67 },  // merch rack
    ],
    spawn: { x: 190, y: 116, face: 'down' },
    things: [
      { id: 'trophy', x: 46, y: 10, w: 89, h: 100, label: 'TROPHY WALL' },
      { id: 'elevator', x: 150, y: 15, w: 80, h: 95, label: 'ELEVATOR' },
      { id: 'tv', x: 282, y: 10, w: 175, h: 130, label: 'TV WALL' },
      { id: 'jukebox', x: 19, y: 82, w: 45, h: 75, label: 'JUKEBOX' },
      { id: 'arcade', x: 72, y: 212, w: 137, h: 67, label: 'ARCADE' },
      { id: 'merch', x: 392, y: 205, w: 87, h: 72, label: 'MERCH RACK' },
      { id: 'door', x: 466, y: 100, w: 24, h: 122, label: 'THE STUDIO · COMING SOON' },   // opens later
    ],
    // the three TV screens in the art (corners clockwise from top-left)
    screens: [
      [[285.75, 18], [333, 14.75], [333, 47.5], [285.75, 50.5]],
      [[340.75, 13.75], [399.75, 13.75], [399.75, 44.5], [340.75, 44.5]],
      [[407.5, 14.75], [454.5, 17.75], [454.75, 50.5], [407.5, 47.5]],
    ],
  },
  studio: {
    map: [
      '####################',
      '####################',
      '####################',
      '#..................#',
      '#..................#',
      '#..................#',
      '...................#',
      '...................#',
      '#..................#',
      '#..................#',
      '#..................#',
      '#..................#',
      '####################',
    ],
    spawn: { x: 1.5 * T, y: 7 * T, face: 'right' },
    things: [
      { id: 'console', x: 6, y: 3, w: 8, h: 2, label: 'MIXING BOARD' },
      { id: 'booth', x: 15, y: 3, w: 4, h: 4, label: 'VOCAL BOOTH' },
      { id: 'door', x: 0, y: 6, w: 1, h: 2, label: 'BACK TO HQ', door: { to: 'hq', x: 28 * T, y: 10 * T, face: 'left' } },
      ...CREW.map((c, i) => ({ id: 'crew', crew: i, x: [3, 8, 12, 5, 15][i], y: [7, 8, 7, 10, 9][i], w: 1, h: 1, label: c.name })),
    ],
  },
};
let room = 'hq', R = ROOMS.hq;
const solidTile = (tx, ty) => { const row = R.map[ty]; return !row || row[tx] === undefined || row[tx] === '#'; };
const thingBox = o => R.img ? o : { x: o.x * T, y: o.y * T, w: o.w * T, h: o.h * T };
const roomW = () => R.img ? R.w : R.map[0].length * T, roomH = () => R.img ? R.h : R.map.length * T;
function inside(px, py, poly) { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) c = !c; } return c; }
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ---------- Miles (top-down): feet box for collisions ---------- */
const P = { x: 0, y: 0, w: 10, h: 6, face: 'down', step: 0 };
function enter(name, spot) {
  room = name; R = ROOMS[name];
  const s = spot || R.spawn; P.x = s.x - P.w / 2; P.y = s.y; P.face = s.face;
}
function blocked(b) {
  if (R.img) return ![[b.x, b.y], [b.x + b.w, b.y], [b.x, b.y + b.h], [b.x + b.w, b.y + b.h]].every(([x, y]) => inside(x, y, R.floor)) || R.solids.some(o => overlap(b, o));
  for (let ty = Math.floor(b.y / T); ty <= Math.floor((b.y + b.h - 0.01) / T); ty++)
    for (let tx = Math.floor(b.x / T); tx <= Math.floor((b.x + b.w - 0.01) / T); tx++) {
      if (tx < 0 || tx >= R.map[0].length) continue;   // open doorways lead off the map edge
      if (solidTile(tx, ty)) return true;
    }
  return R.things.some(o => !o.wall && !o.door && overlap(b, thingBox(o)));
}
const DIR = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function facing() {   // the station right in front of Miles
  const [dx, dy] = DIR[P.face], cx = P.x + P.w / 2 + dx * 14, cy = P.y + P.h / 2 + dy * 14;
  const probe = { x: cx - 5, y: cy - 5, w: 10, h: 10 };
  return R.things.find(o => o.label && overlap(probe, thingBox(o)));
}

/* ---------- input ---------- */
const keys = {}; let actPressed = false;
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'act', Enter: 'act' };
addEventListener('keydown', e => {
  firstGesture();
  if (!panelEl.hidden) { if (e.code === 'Escape') closePanel(); return; }
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault(); if (e.repeat && k === 'act') return;
  if (k === 'act') actPressed = true; else keys[k] = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('.pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('on'); if (k === 'act') actPressed = true; else keys[k] = true; firstGesture(); });
  const up = e => { e.preventDefault(); b.classList.remove('on'); keys[k] = false; };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});
cv.addEventListener('pointerdown', () => { firstGesture(); actPressed = true; });

/* ---------- station panels ---------- */
const panelEl = document.getElementById('panel'), cardEl = document.getElementById('card');
const X = '<button class="x" id="px" aria-label="Close"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5L5 19"/></svg></button>';
let jukeAudio = null, jukeIdx = -1;
function openPanel(html) {
  cardEl.innerHTML = X + html; panelEl.hidden = false;
  document.getElementById('px').onclick = closePanel;
  for (const k in keys) keys[k] = false;
  (cardEl.querySelector('.btn') || document.getElementById('px')).focus({ preventScroll: true });
}
function closePanel() { panelEl.hidden = true; cardEl.innerHTML = ''; tvSound(); }   // clearing it stops any video still playing
panelEl.addEventListener('pointerdown', e => { if (e.target === panelEl) closePanel(); });
const load = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

function useThing(o) {
  if (o.door) { enter(o.door.to, o.door); return; }
  if (o.id === 'door') { openPanel('<h2>THE STUDIO</h2><p class="sub">The people behind NORTH STAR. Coming soon.</p>'); return; }
  if (o.id === 'elevator') {
    openPanel('<h2>ELEVATOR</h2><p class="sub">Pick a floor. In the full game this drops you straight into the level.</p><ul class="rows">' +
      '<li><span>CHAPTER 1 · THE BREAKOUT<small>Replay any level</small></span></li>' +
      LEVELS.map((l, i) => `<li><span>${i + 1} · ${l}</span><a class="btn" href="index.html">PLAY</a></li>`).join('') +
      CHAPTERS.map(([n, d]) => `<li class="lock"><span>${n}<small>${d}</small></span><span class="btn ghost">SOON</span></li>`).join('') + '</ul>');
  } else if (o.id === 'jukebox') {
    const row = (s, i) => `<li><span>${s.title}${s.credit ? '<small>' + s.credit + '</small>' : ''}</span><button class="btn" data-song="${i}">${jukeIdx === i && jukeAudio && !jukeAudio.paused ? 'PAUSE' : 'PLAY'}</button></li>`;
    openPanel('<h2>JUKEBOX</h2><p class="sub">Pick a song.</p><ul class="rows">' + SONGS.map(row).join('') + '</ul>');
    cardEl.querySelectorAll('[data-song]').forEach(b => b.onclick = () => {
      const i = +b.dataset.song;
      if (jukeIdx === i && jukeAudio && !jukeAudio.paused) { jukeAudio.pause(); }
      else { if (jukeAudio) jukeAudio.pause(); if (jukeIdx !== i) { jukeAudio = new Audio(SONGS[i].src); jukeIdx = i; jukeAudio.addEventListener('ended', tvSound); jukeAudio.addEventListener('pause', tvSound); jukeAudio.addEventListener('play', tvSound); } jukeAudio.volume = 0.6; jukeAudio.play().catch(() => {}); }
      cardEl.querySelectorAll('[data-song]').forEach(x => x.textContent = (+x.dataset.song === jukeIdx && !jukeAudio.paused) ? 'PAUSE' : 'PLAY');
    });
  } else if (o.id === 'tv') {
    const embed = id => `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0`;
    openPanel(`<h2>TV WALL</h2><div class="yt"><iframe id="yt" src="${embed(VIDEOS[0].id)}" title="Miles Low video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>` +
      '<ul class="rows">' + VIDEOS.map((v, i) => `<li><span>${v.title}<small>${v.sub}</small></span><button class="btn" data-vid="${i}">WATCH</button></li>`).join('') + '</ul>');
    cardEl.querySelectorAll('[data-vid]').forEach(b => b.onclick = () => { document.getElementById('yt').src = embed(VIDEOS[+b.dataset.vid].id); });
    tvSound();
  } else if (o.id === 'arcade') {
    openPanel('<h2>ARCADE</h2><p class="sub">Mini-games.</p><ul class="rows">' +
      [['RAP BATTLE', 'Land the hardest bar on the beat'], ['DAILY SPIN', 'One spin a day for coins and outfit pieces'], ['BEAT TAP', 'Tap on the beat to Miles\'s songs']]
        .map(([n, d]) => `<li class="lock"><span>${n}<small>${d}</small></span><span class="btn ghost">SOON</span></li>`).join('') + '</ul>');
  } else if (o.id === 'merch') {
    openPanel('<h2>MERCH RACK</h2><p class="sub">Every outfit is a real North Star piece. Wear it in the game, get the real one in the store.</p><img class="wide" src="images/society-shirts.webp" alt="North Star shirts">' +
      '<ul class="rows">' + [['NORTHTOWN DOVE TEE', 'Balanced'], ['DOPESQUE 702 TEE', 'Runs faster'], ['BATTLE BORN 2015 TEE', 'One extra hit'], ['NORTH STAR BANDANA', 'Pulls in coins'], ['NORTH STAR FLAG CAPE', 'Glides']]
        .map(([n, p]) => `<li><span>${n}<small>${p}</small></span><a class="btn" href="${MERCH_URL}" target="_blank" rel="noopener">GET IT ↗</a></li>`).join('') + '</ul>');
  } else if (o.id === 'trophy') {
    const b = load('ns-best-v1') || {}, s = load('ns-society-v1');
    openPanel('<h2>TROPHY WALL</h2><p class="sub">' + (b.time ? 'Your best run.' : 'Beat Chapter 1 to fill this wall.') + '</p><div class="stats">' +
      `<div>MASTERS<b>${b.masters ?? 0}/7</b></div><div>BEST TIME<b>${b.time ? mmss(b.time) : '--'}</b></div><div>COINS<b>${b.coins ?? '--'}</b></div></div>` +
      `<ul class="rows"><li><span>SOCIETY CARD<small>${s && s.member ? 'Member No. ' + String(s.member).padStart(4, '0') : s ? 'Member' : 'Not a member yet'}</small></span></li>` +
      '<li><span>SHARE CARD<small>Your Instagram Story card lives here</small></span></li></ul>');
  } else if (o.id === 'crew') {
    const c = CREW[o.crew];
    openPanel(`<h2>${c.name}</h2><p class="sub">${c.role}</p><ul class="rows"><li><span>ON NORTH STAR<small>${c.note}</small></span></li></ul>`);
  } else if (o.id === 'console') {
    openPanel('<h2>MIXING BOARD</h2><p class="sub">Where NORTH STAR got made. Studio sessions and BTS clips can play here.</p>');
  } else if (o.id === 'booth') {
    openPanel('<h2>VOCAL BOOTH</h2><p class="sub">Freestyles, demos and alternate takes from the mixtape can live here.</p>');

}

/* ---------- update ---------- */
const SPEED = 82;
function update(dt) {
  if (!panelEl.hidden) { actPressed = false; return; }
  const dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  if (dx || dy) {
    P.face = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    const n = dx && dy ? Math.SQRT1_2 : 1;
    const nx = { x: P.x + dx * SPEED * n * dt, y: P.y, w: P.w, h: P.h }; if (!blocked(nx)) P.x = nx.x;
    const ny = { x: P.x, y: P.y + dy * SPEED * n * dt, w: P.w, h: P.h }; if (!blocked(ny)) P.y = ny.y;
    P.step += dt;
    if (!R.img && (P.x > roomW() - 2 || P.x < -P.w + 2)) { const d = R.things.find(o => o.door); if (d) enter(d.door.to, d.door); }   // walking out an open doorway
  } else P.step = 0;
  if (actPressed) { actPressed = false; const o = facing(); if (o) useThing(o); }
}

/* ---------- drawing (placeholder shapes; the Higgsfield room art replaces these) ---------- */
function rect(c, x, y, w, h) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }

let t = 0;
const roomImg = new Image(); roomImg.src = ROOMS.hq.img;
const milesImg = new Image(); milesImg.src = 'images/hq-miles.png';
const MILES = { cw: 25, h: 48, frames: { down: [0, 1, 2, 3], left: [4, 5, 6, 7], right: [8, 9, 10, 11], up: [12, 13, 14, 15] } };   // world units; atlas is 4x
function drawScreen(q, i) {   // the TV video, fitted into one screen of the art
  const xs = q.map(p => p[0]), ys = q.map(p => p[1]), x = Math.min(...xs), y = Math.min(...ys), w = Math.max(...xs) - x, h = Math.max(...ys) - y;

    const vw = tv.videoWidth, vh = tv.videoHeight;

    const fs = Math.min(w / vw, h / vh); ctx.drawImage(tv, x + (w - vw * fs) / 2, y + (h - vh * fs) / 2, vw * fs, vh * fs);
  } else {

  }
  rect('rgba(0,0,0,.16)', x, y + ((t * 14 + i * 9) % h), w, 0.5);   // scanline roll

  ctx.restore();
}
function drawRoom() {
  if (R.img) {
    if (roomImg.complete && roomImg.naturalWidth) ctx.drawImage(roomImg, 0, 0, R.w, R.h); else rect('#140f24', 0, 0, R.w, R.h);
    R.screens.forEach(drawScreen);
    const j = R.things.find(o => o.id === 'jukebox'), pulse = songOn() ? 0.22 + 0.12 * Math.sin(t * 9) : 0.08 + 0.04 * Math.sin(t * 2);
    ctx.globalCompositeOperation = 'lighter'; const gr = ctx.createRadialGradient(j.x + 22, j.y + 30, 2, j.x + 22, j.y + 30, 34);
    gr.addColorStop(0, `rgba(190,120,255,${pulse})`); gr.addColorStop(1, 'rgba(190,120,255,0)'); ctx.fillStyle = gr; ctx.fillRect(j.x - 14, j.y - 6, 72, 80); ctx.globalCompositeOperation = 'source-over';
    const f = facing();
    if (f) { const bob = Math.sin(t * 6) * 1.5; ctx.fillStyle = '#ffcc33'; ctx.beginPath(); const cx = Math.min(Math.max(f.x + f.w / 2, 6), R.w - 6), cy = Math.max(f.y, 4) + bob; ctx.moveTo(cx - 4, cy); ctx.lineTo(cx + 4, cy); ctx.lineTo(cx, cy + 5); ctx.fill(); }
    return;
  }
  const rows = R.map.length, cols = R.map[0].length;
  for (let ty = 0; ty < rows; ty++) for (let tx = 0; tx < cols; tx++) {
    const x = tx * T, y = ty * T;
    if (R.map[ty][tx] === '#') {
      rect(ty < 3 ? (ty === 2 ? '#2a2352' : '#1d1840') : '#0c0a1c', x, y, T, T);
      if (ty === 2) { rect('#3a3270', x, y + 13, T, 3); }
      if (ty === 0) rect('#141130', x, y, T, 4);
    } else {
      rect((tx + ty) % 2 ? (room === 'hq' ? '#14112b' : '#1a1410') : (room === 'hq' ? '#17132f' : '#1f1813'), x, y, T, T);
      rect('rgba(255,204,51,.05)', x, y, T, 1);
    }
  }
  if (room === 'hq') {   // rug with the North Star emblem
    ctx.globalAlpha = 0.9; rect('#1d3fbf', 10 * T, 7 * T, 8 * T, 5 * T); rect('#ffcc33', 10 * T + 3, 7 * T + 3, 8 * T - 6, 1); rect('#ffcc33', 10 * T + 3, 12 * T - 4, 8 * T - 6, 1);
    star(14 * T, 9.5 * T, 22, '#f3ead8'); ctx.globalAlpha = 1;

}
function glowIf(o) { const f = facing(); return f === o; }
function drawThing(o) {
  const b = thingBox(o), hot = glowIf(o);
  if (o.id === 'elevator') {
    rect('#8a6a1a', b.x, b.y + 6, b.w, b.h - 6); rect('#c9a23a', b.x + 4, b.y + 12, b.w / 2 - 5, b.h - 12); rect('#c9a23a', b.x + b.w / 2 + 1, b.y + 12, b.w / 2 - 5, b.h - 12);
    rect('#3a2a0a', b.x + b.w / 2 - 1, b.y + 12, 2, b.h - 12); txt('ELEVATOR', b.x + b.w / 2, b.y + 2, '#ffcc33', 5);
  } else if (o.id === 'trophy') {
    const best = load('ns-best-v1');
    for (let i = 0; i < 7; i++) { const x = b.x + 4 + i * 13; rect('#3a2a0a', x, b.y + 8, 10, 12); rect(best && i < best.masters ? '#ffcc33' : '#2a2352', x + 2, b.y + 10, 6, 8); }
    txt('TROPHIES', b.x + b.w / 2, b.y + 1, '#ffcc33', 5);
  } else if (o.id === 'tv') {
    for (let i = 0; i < 3; i++) {
      const x = b.x + 2 + i * 47, y = b.y + 6, w = 42, h = 22;
      rect('#000', x - 2, y - 2, w + 4, h + 4);
      const im = FRAMES[i][Math.floor(t / 2.6 + i * 1.3) % 4], k = (t / 2.6 + i * 1.3) % 1;   // a new frame every few seconds, slowly drifting
      if (tv.readyState >= 2) { const vw = tv.videoWidth, vh = tv.videoHeight, sh = Math.min(vh, vw * h / w), sw = sh * w / h; ctx.drawImage(tv, (vw - sw) / 2, (vh - sh) / 2, sw, sh, x, y, w, h); }
      else if (im.complete && im.naturalWidth > 0) { const sw = im.naturalWidth * 0.86, sh = sw * h / w; ctx.drawImage(im, (im.naturalWidth - sw) * k, (im.naturalHeight - sh) / 2, sw, sh, x, y, w, h); }
      else rect('#1d3fbf', x, y, w, h);
      rect('rgba(0,0,0,.18)', x, y + ((t * 20 + i * 7) % h), w, 1);   // scanline roll
      rect('rgba(255,255,255,.06)', x, y, w, 4);
    }
  } else if (o.id === 'jukebox') {
    rect('#5a1a3a', b.x, b.y + 4, b.w, b.h - 4); ctx.fillStyle = '#e8413c'; ctx.beginPath(); ctx.arc(b.x + b.w / 2, b.y + 8, b.w / 2, Math.PI, 0); ctx.fill();
    for (let i = 0; i < 4; i++) rect(['#ffcc33', '#3ee6ff', '#4dff7a', '#c77dff'][(i + Math.floor(t * 4)) % 4], b.x + 4 + i * 6, b.y + 18, 4, 14);
    rect('#ffcc33', b.x + 6, b.y + 36, b.w - 12, 3);
  } else if (o.id === 'couch') {
    rect('#3a1f5c', b.x, b.y, b.w, b.h + 6); rect('#4b2a75', b.x + 2, b.y + 2, b.w - 4, 8);
  } else if (o.id === 'arcade') {
    for (let i = 0; i < 3; i++) { const x = b.x + 6 + i * 36; rect('#14112b', x, b.y + 2, 24, 30); rect(['#e8413c', '#3ee6ff', '#4dff7a'][i], x + 3, b.y + 5, 18, 12); rect('#ffcc33', x + 8, b.y + 22, 3, 3); rect('#e8413c', x + 14, b.y + 22, 3, 3); }
    txt('ARCADE', b.x + b.w / 2, b.y - 7, '#3ee6ff', 5);
  } else if (o.id === 'merch') {
    rect('#8a8aa0', b.x + 4, b.y + 3, b.w - 8, 2);
    ['#f3ead8', '#f3ead8', '#1d3fbf', '#e8413c', '#1d3fbf'].forEach((c, i) => { const x = b.x + 10 + i * 20; rect(c, x, b.y + 6, 14, 18); rect(c, x - 3, b.y + 6, 3, 6); rect(c, x + 14, b.y + 6, 3, 6); });
    txt('MERCH', b.x + b.w / 2, b.y - 7, '#ffcc33', 5);
  } else if (o.id === 'door') {
    rect('#ffcc33', b.x + (room === 'hq' ? 10 : 0), b.y, 6, b.h);
    txt(room === 'hq' ? 'STUDIO · SOON' : o.label, room === 'hq' ? b.x - 4 : b.x + 22, b.y - 8, '#ffcc33', 5, room === 'hq' ? 'right' : 'left');
  } else if (o.id === 'console') {
    rect('#22201f', b.x, b.y, b.w, b.h); for (let i = 0; i < 24; i++) rect(['#ffcc33', '#3ee6ff', '#e8413c'][i % 3], b.x + 4 + i * 5, b.y + 6 + (Math.sin(t * 3 + i) > 0 ? 0 : 3), 2, 4);
    rect('#0c0c0c', b.x + 20, b.y + 18, b.w - 40, 8);
  } else if (o.id === 'booth') {
    ctx.strokeStyle = '#7ac4ff'; ctx.lineWidth = 2; ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    rect('rgba(122,196,255,.12)', b.x + 2, b.y + 2, b.w - 4, b.h - 4); rect('#ccc', b.x + b.w / 2 - 1, b.y + 20, 2, 20); rect('#999', b.x + b.w / 2 - 4, b.y + 16, 8, 6);
  } else if (o.id === 'crew') {
    const c = CREW[o.crew], cx = b.x + 8, fy = b.y + 14;
    rect('rgba(0,0,0,.35)', cx - 6, fy - 1, 12, 3); rect(c.col, cx - 5, fy - 14, 10, 12); rect('#7a4a2a', cx - 4, fy - 22, 8, 8); rect('#1a1a1a', cx - 4, fy - 23, 8, 3);
    txt(c.name, cx, fy - 31, c.col, 4);
  }
  if (hot) {   // what Miles is facing glows and shows what pressing A does
    ctx.strokeStyle = 'rgba(255,204,51,' + (0.6 + 0.4 * Math.sin(t * 8)) + ')'; ctx.lineWidth = 1.5; ctx.strokeRect(b.x - 1, b.y - 1, b.w + 2, b.h + 2);
  }
}
function drawMiles() {
  if (R.img && milesImg.complete && milesImg.naturalWidth) {
    const cx = P.x + P.w / 2, fy = P.y + P.h, list = MILES.frames[P.face], k = P.step ? list[1 + Math.floor(P.step * 7) % 3] : list[0];
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(cx, fy - 1, 9, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.drawImage(milesImg, k * MILES.cw * 4, 0, MILES.cw * 4, MILES.h * 4, Math.round((cx - MILES.cw / 2) * 4) / 4, Math.round((fy - MILES.h + 1) * 4) / 4, MILES.cw, MILES.h);
    return;
  }
  const cx = P.x + P.w / 2, fy = P.y + P.h, bob = P.step ? Math.round(Math.sin(P.step * 14)) : 0;
  rect('rgba(0,0,0,.4)', cx - 7, fy - 2, 14, 4);
  const legs = P.step ? (Math.sin(P.step * 14) > 0 ? 2 : -2) : 0;
  rect('#5d6a3a', cx - 5, fy - 9, 4, 8 + (legs > 0 ? 1 : 0)); rect('#5d6a3a', cx + 1, fy - 9, 4, 8 + (legs < 0 ? 1 : 0));   // camo pants
  rect('#1d3fbf', cx - 6, fy - 20 + bob, 12, 12);   // NORTHTOWN tee
  rect('#ffcc33', cx - 2, fy - 18 + bob, 4, 1);    // chain
  rect('#7a4a2a', cx - 4, fy - 28 + bob, 8, 8);    // head
  rect('#1a1a1a', cx - 5, fy - 29 + bob, 10, P.face === 'up' ? 8 : 4);   // braids
  if (P.face === 'down') { rect('#000', cx - 3, fy - 24 + bob, 2, 2); rect('#000', cx + 1, fy - 24 + bob, 2, 2); }
  if (P.face === 'left') rect('#000', cx - 4, fy - 24 + bob, 2, 2);
  if (P.face === 'right') rect('#000', cx + 2, fy - 24 + bob, 2, 2);
}
function render() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  rect('#05040d', 0, 0, W, H);
  const rw = roomW(), rh = roomH();
  const camX = rw <= W ? (rw - W) / 2 : Math.max(0, Math.min(rw - W, P.x + P.w / 2 - W / 2));
  const camY = rh <= H ? (rh - H) / 2 : Math.max(0, Math.min(rh - H, P.y - 20 - H / 2));
  ctx.save(); ctx.translate(-Math.round(camX * SCALE) / SCALE, -Math.round(camY * SCALE) / SCALE);   // whole screen pixels keep the art crisp

    ctx.lineWidth = 0.6; ctx.strokeStyle = '#0f0'; ctx.beginPath(); R.floor.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.stroke();
    ctx.strokeStyle = '#f00'; R.solids.forEach(o => ctx.strokeRect(o.x, o.y, o.w, o.h));
    ctx.strokeStyle = '#0ff'; R.things.forEach(o => ctx.strokeRect(o.x, o.y, o.w, o.h));
  }
  ctx.restore();
  const f = panelEl.hidden && facing();
  if (f) { rect('rgba(5,4,15,.85)', 0, H - 18, W, 18); rect('#ffcc33', 0, H - 18, W, 1); txt((TOUCH ? 'TAP A' : 'SPACE') + ' · ' + f.label, W / 2, H - 12, '#ffcc33', 6); }
  txt(room === 'hq' ? 'NORTH STAR HQ' : 'THE STUDIO', 6, 5, '#a99bc2', 5, 'left');
}

/* ---------- loop ---------- */
enter('hq');
window.__hq = { P, get room() { return room; }, facing: () => facing() && facing().label, tv: () => (tv.paused ? 'paused' : 'playing') + (tv.muted ? ', muted' : ', sound on') };
let last = performance.now();

  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; t += dt;

}
document.fonts && document.fonts.load('8px "Press Start 2P"').finally(() => requestAnimationFrame(frame));
})();
