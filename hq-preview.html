<meta charset="utf-8">
<title>North Star HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* HQ layout preview: walkable top-down room. Placeholder shapes stand in for the Higgsfield art. */
:root{--bg:#07060f;--fg:#f3ead8;--accent:#ffcc33;--dim:#7a7199;--pad:#1b1730;--pad-edge:#3a3260;--font:"Press Start 2P",ui-monospace,monospace;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
html,body{height:100%}
body{margin:0;padding:16px;box-sizing:border-box;background:var(--bg);color:var(--fg);font-family:var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.stage{position:relative;line-height:0;max-width:100%;box-shadow:0 0 0 3px #000,0 0 0 5px var(--pad-edge),0 18px 50px rgba(0,0,0,.65)}
canvas{display:block;max-width:100%;image-rendering:pixelated;touch-action:none}
.hint{font-size:9px;letter-spacing:.08em;color:var(--dim);text-align:center;line-height:1.9}
.hint b{color:var(--accent);font-weight:400}
.tag{font-size:8px;letter-spacing:.14em;color:#3ee6ff}
.pad{display:none;width:100%;max-width:520px;justify-content:space-between;align-items:center;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,52px);gap:4px}
.pad button{font:inherit;font-size:11px;color:var(--fg);background:var(--pad);border:2px solid var(--pad-edge);border-bottom-width:5px;border-radius:10px;display:grid;place-items:center;padding:0;touch-action:none}
.pad button.on{transform:translateY(2px);border-bottom-width:3px;filter:brightness(1.3)}
.pad svg{width:20px;height:20px;fill:currentColor}
.dpad [data-k=up]{grid-area:1/2}.dpad [data-k=left]{grid-area:2/1}.dpad [data-k=right]{grid-area:2/3}.dpad [data-k=down]{grid-area:3/2}
.pad .act{width:84px;height:84px;border-radius:50%;background:#3a1f2a;border-color:#e8413c;color:var(--accent);font-size:16px}
@media (pointer:coarse){.pad{display:flex}.hint .keys{display:none}}
/* station panels */
.panel{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(5,4,15,.72);-webkit-user-select:text;user-select:text}
.panel[hidden]{display:none}
.card{position:relative;width:min(460px,100%);max-height:calc(100vh - 32px);overflow-y:auto;box-sizing:border-box;background:#100c22;border:3px solid var(--accent);border-radius:12px;padding:22px 18px 18px;box-shadow:0 0 0 3px #000,0 24px 60px rgba(0,0,0,.7)}
.card h2{margin:0 0 6px;font-weight:400;font-size:14px;line-height:1.6;color:var(--accent);text-shadow:3px 3px 0 #3a1030}
.card .sub{margin:0 0 16px;font-family:var(--sans);font-size:14px;line-height:1.5;color:#cfc3e0}
.x{position:absolute;top:6px;right:6px;width:40px;height:40px;background:none;border:0;color:#a99bc2;cursor:pointer;padding:10px}
.x svg{width:100%;height:100%;stroke:currentColor;stroke-width:2.6}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rows li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:2px solid #3a3260;border-radius:8px;font-size:9px;line-height:1.6;letter-spacing:.06em}
.rows li small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:0;color:#a99bc2;margin-top:3px}
.rows li.lock{opacity:.5}
.btn{font:inherit;font-size:9px;letter-spacing:.06em;color:#100c22;background:var(--accent);border:0;border-bottom:3px solid #b8860b;border-radius:6px;padding:9px 11px;cursor:pointer;white-space:nowrap;text-decoration:none;flex:none}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--pad-edge)}
.btn:focus-visible,.x:focus-visible{outline:2px solid #3ee6ff;outline-offset:2px}
.card video{width:100%;border-radius:8px;display:block;margin-bottom:12px;background:#000}
.card img.wide{width:100%;border-radius:8px;display:block;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{border:2px solid #3a3260;border-radius:8px;padding:10px 4px;text-align:center;font-size:7px;letter-spacing:.1em;color:#a99bc2;line-height:2}
.stats b{display:block;font-weight:400;font-size:13px;color:var(--accent)}
</style>

<div class="tag">HQ LAYOUT PREVIEW · PLACEHOLDER ART</div>
<div class="stage"><canvas id="hq" width="1280" height="768" aria-label="North Star HQ"></canvas></div>
<div class="hint"><span class="keys"><b>ARROWS / WASD</b> WALK &nbsp;·&nbsp; <b>SPACE / ENTER</b> USE &nbsp;·&nbsp; <b>ESC</b> CLOSE<br></span>WALK UP TO ANYTHING THAT GLOWS</div>
<div class="pad">
  <div class="dpad">
    <button data-k="up" aria-label="Walk up"><svg viewBox="0 0 10 10"><path d="M1 7l4-5 4 5z"/></svg></button>
    <button data-k="left" aria-label="Walk left"><svg viewBox="0 0 10 10"><path d="M7 1 2 5l5 4z"/></svg></button>
    <button data-k="right" aria-label="Walk right"><svg viewBox="0 0 10 10"><path d="M3 1l5 4-5 4z"/></svg></button>
    <button data-k="down" aria-label="Walk down"><svg viewBox="0 0 10 10"><path d="M1 3l4 5 4-5z"/></svg></button>
  </div>
  <button class="act" data-k="act" aria-label="Use">A</button>
</div>
<div class="panel" id="panel" hidden role="dialog" aria-modal="true"><div class="card" id="card"></div></div>

<script>
(() => {
"use strict";
const W = 320, H = 192, T = 16, SCALE = 4;
const cv = document.getElementById('hq'), ctx = cv.getContext('2d');
const TOUCH = matchMedia('(pointer:coarse)').matches;
const FONT = '"Press Start 2P", monospace';
ctx.imageSmoothingEnabled = false;

function resize() {
  const pad = document.querySelector('.pad'), extra = (pad.offsetParent ? pad.offsetHeight + 14 : 0) + 70;
  let s = Math.min((document.body.clientWidth - 42) / W, (innerHeight - extra - 42) / H);
  if (s >= 2) s = Math.floor(s);
  cv.style.width = Math.round(W * s) + 'px'; cv.style.height = Math.round(H * s) + 'px';
}
addEventListener('resize', resize); resize();

/* ---------- content (swap in Miles's real lists) ---------- */
const SONGS = [
  { title: 'Ten Toes', src: 'audio/ten-toes.mp3' },
  { title: 'Blame the Weather Man', src: 'audio/weatherman.mp3' },
  { title: 'Boomerang', src: 'audio/boomerang.mp3' },
  { title: '500 Degrees', src: 'audio/500-degrees.mp3' },
];
const MP4 = document.createElement('video').canPlayType('video/mp4; codecs="avc1.42E01E"') !== '';
const VIDEOS = [{ title: 'North Star Society card', src: MP4 ? 'images/society-card.mp4' : 'images/society-card.webm' }];
const CREW = [
  { name: 'PRODUCER 1', role: 'Producer', note: 'Name, credits, photo and links go here.', col: '#e8413c' },
  { name: 'PRODUCER 2', role: 'Producer', note: 'Name, credits, photo and links go here.', col: '#3ee6ff' },
  { name: 'FEATURE 1', role: 'Featured artist', note: 'Name, song, photo and links go here.', col: '#4dff7a' },
  { name: 'FEATURE 2', role: 'Featured artist', note: 'Name, song, photo and links go here.', col: '#c77dff' },
  { name: 'ENGINEER', role: 'Mix & master', note: 'Name, credits, photo and links go here.', col: '#ffcc33' },
];
const MERCH_URL = 'https://mileslowmusic.com';
const LEVELS = ['THE STUDIO', 'DOWNTOWN', 'HISTORIC WESTSIDE', 'THE STRIP', 'THE PENTHOUSE'];
const CHAPTERS = [['CHAPTER 2 · THE UNDERGROUND', 'Northtown · Boulder Highway · the Tunnels · Boss: THE CURATOR'],
  ['CHAPTER 3 · THE BOT FARMS', 'Los Angeles · Houston · Atlanta · New York · the Machine World · Boss: THE BOT FATHER'],
  ['CHAPTER 4 · THE COSMIC WAR', 'Space · Boss: ALGOL, THE DEMON STAR']];

/* ---------- the TV wall loops video like a barbershop TV ---------- */
const tv = document.createElement('video');
tv.src = VIDEOS[0].src; tv.muted = true; tv.loop = true; tv.playsInline = true; tv.setAttribute('playsinline', '');
tv.play().catch(() => {});

/* ---------- rooms: walls come from the tile map, furniture from solid boxes ---------- */
// '#' wall, '.' floor. Stations are boxes you walk up to; "use" is the side you press A from.
const ROOMS = {
  hq: {
    map: [
      '##############################',
      '##############################',
      '##############################',
      '#............................#',
      '#............................#',
      '#............................#',
      '#............................#',
      '#............................#',
      '#............................#',
      '#.............................',
      '#.............................',
      '#............................#',
      '#............................#',
      '#............................#',
      '#............................#',
      '#............................#',
      '#............................#',
      '##############################',
    ],
    spawn: { x: 14.5 * T, y: 5 * T, face: 'down' },
    things: [
      { id: 'trophy', x: 3, y: 1, w: 6, h: 2, label: 'TROPHY WALL', wall: true },
      { id: 'elevator', x: 13, y: 0, w: 4, h: 3, label: 'ELEVATOR', wall: true },
      { id: 'tv', x: 19, y: 1, w: 9, h: 2, label: 'TV WALL', wall: true },
      { id: 'jukebox', x: 1, y: 5, w: 2, h: 3, label: 'JUKEBOX' },
      { id: 'couch', x: 20, y: 6, w: 7, h: 1, solid: true },
      { id: 'arcade', x: 2, y: 13, w: 7, h: 2, label: 'ARCADE' },
      { id: 'merch', x: 21, y: 13, w: 7, h: 2, label: 'MERCH RACK' },
      { id: 'door', x: 29, y: 9, w: 1, h: 2, label: 'THE STUDIO', door: { to: 'studio', x: 1.5 * T, y: 7 * T, face: 'right' } },
    ],
  },
  studio: {
    map: [
      '####################',
      '####################',
      '####################',
      '#..................#',
      '#..................#',
      '#..................#',
      '...................#',
      '...................#',
      '#..................#',
      '#..................#',
      '#..................#',
      '#..................#',
      '####################',
    ],
    spawn: { x: 1.5 * T, y: 7 * T, face: 'right' },
    things: [
      { id: 'console', x: 6, y: 3, w: 8, h: 2, label: 'MIXING BOARD' },
      { id: 'booth', x: 15, y: 3, w: 4, h: 4, label: 'VOCAL BOOTH' },
      { id: 'door', x: 0, y: 6, w: 1, h: 2, label: 'BACK TO HQ', door: { to: 'hq', x: 28 * T, y: 10 * T, face: 'left' } },
      ...CREW.map((c, i) => ({ id: 'crew', crew: i, x: [3, 8, 12, 5, 15][i], y: [7, 8, 7, 10, 9][i], w: 1, h: 1, label: c.name })),
    ],
  },
};
let room = 'hq', R = ROOMS.hq;
const solidTile = (tx, ty) => { const row = R.map[ty]; return !row || row[tx] === undefined || row[tx] === '#'; };
const thingBox = o => ({ x: o.x * T, y: o.y * T, w: o.w * T, h: o.h * T });
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ---------- Miles (top-down): feet box for collisions ---------- */
const P = { x: 0, y: 0, w: 10, h: 6, face: 'down', step: 0 };
function enter(name, spot) {
  room = name; R = ROOMS[name];
  const s = spot || R.spawn; P.x = s.x - P.w / 2; P.y = s.y; P.face = s.face;
}
function blocked(b) {
  for (let ty = Math.floor(b.y / T); ty <= Math.floor((b.y + b.h - 0.01) / T); ty++)
    for (let tx = Math.floor(b.x / T); tx <= Math.floor((b.x + b.w - 0.01) / T); tx++) {
      if (tx < 0 || tx >= R.map[0].length) continue;   // open doorways lead off the map edge
      if (solidTile(tx, ty)) return true;
    }
  return R.things.some(o => !o.wall && !o.door && overlap(b, thingBox(o)));
}
const DIR = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function facing() {   // the station right in front of Miles
  const [dx, dy] = DIR[P.face], cx = P.x + P.w / 2 + dx * 14, cy = P.y + P.h / 2 + dy * 14;
  const probe = { x: cx - 5, y: cy - 5, w: 10, h: 10 };
  return R.things.find(o => o.label && overlap(probe, thingBox(o)));
}

/* ---------- input ---------- */
const keys = {}; let actPressed = false;
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'act', Enter: 'act' };
addEventListener('keydown', e => {
  if (!panelEl.hidden) { if (e.code === 'Escape') closePanel(); return; }
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault(); if (e.repeat && k === 'act') return;
  if (k === 'act') actPressed = true; else keys[k] = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('.pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('on'); if (k === 'act') actPressed = true; else keys[k] = true; tv.play().catch(() => {}); });
  const up = e => { e.preventDefault(); b.classList.remove('on'); keys[k] = false; };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});
cv.addEventListener('pointerdown', () => { tv.play().catch(() => {}); actPressed = true; });

/* ---------- station panels ---------- */
const panelEl = document.getElementById('panel'), cardEl = document.getElementById('card');
const X = '<button class="x" id="px" aria-label="Close"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5L5 19"/></svg></button>';
let jukeAudio = null, jukeIdx = -1;
function openPanel(html) {
  cardEl.innerHTML = X + html; panelEl.hidden = false;
  document.getElementById('px').onclick = closePanel;
  for (const k in keys) keys[k] = false;
  (cardEl.querySelector('.btn') || document.getElementById('px')).focus({ preventScroll: true });
}
function closePanel() { panelEl.hidden = true; const v = cardEl.querySelector('video'); if (v) v.pause(); cv.focus && cv.focus(); }
panelEl.addEventListener('pointerdown', e => { if (e.target === panelEl) closePanel(); });
const load = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

function useThing(o) {
  if (o.door) { enter(o.door.to, o.door); return; }
  if (o.id === 'elevator') {
    openPanel('<h2>ELEVATOR</h2><p class="sub">Pick a floor. In the full game this drops you straight into the level.</p><ul class="rows">' +
      '<li><span>CHAPTER 1 · THE BREAKOUT<small>Replay any level</small></span></li>' +
      LEVELS.map((l, i) => `<li><span>${i + 1} · ${l}</span><a class="btn" href="index.html">PLAY</a></li>`).join('') +
      CHAPTERS.map(([n, d]) => `<li class="lock"><span>${n}<small>${d}</small></span><span class="btn ghost">SOON</span></li>`).join('') + '</ul>');
  } else if (o.id === 'jukebox') {
    const row = (s, i) => `<li><span>${s.title}</span><button class="btn" data-song="${i}">${jukeIdx === i && jukeAudio && !jukeAudio.paused ? 'PAUSE' : 'PLAY'}</button></li>`;
    openPanel('<h2>JUKEBOX</h2><p class="sub">Pick a song. Your full album, previews, and the mixtape go here.</p><ul class="rows">' + SONGS.map(row).join('') + '</ul>');
    cardEl.querySelectorAll('[data-song]').forEach(b => b.onclick = () => {
      const i = +b.dataset.song;
      if (jukeIdx === i && jukeAudio && !jukeAudio.paused) { jukeAudio.pause(); }
      else { if (jukeAudio) jukeAudio.pause(); if (jukeIdx !== i) { jukeAudio = new Audio(SONGS[i].src); jukeIdx = i; } jukeAudio.volume = 0.6; jukeAudio.play().catch(() => {}); }
      cardEl.querySelectorAll('[data-song]').forEach(x => x.textContent = (+x.dataset.song === jukeIdx && !jukeAudio.paused) ? 'PAUSE' : 'PLAY');
    });
  } else if (o.id === 'tv') {
    openPanel(`<h2>TV WALL</h2><p class="sub">The wall loops Miles Low videos all day. Music videos, performances, BTS and the listening party replay go here.</p><video src="${VIDEOS[0].src}" controls playsinline autoplay loop></video>` +
      '<ul class="rows">' + VIDEOS.map(v => `<li><span>${v.title}</span></li>`).join('') + '</ul>');
  } else if (o.id === 'arcade') {
    openPanel('<h2>ARCADE</h2><p class="sub">Mini-games.</p><ul class="rows">' +
      [['RAP BATTLE', 'Land the hardest bar on the beat'], ['DAILY SPIN', 'One spin a day for coins and outfit pieces'], ['BEAT TAP', 'Tap on the beat to Miles\'s songs']]
        .map(([n, d]) => `<li class="lock"><span>${n}<small>${d}</small></span><span class="btn ghost">SOON</span></li>`).join('') + '</ul>');
  } else if (o.id === 'merch') {
    openPanel('<h2>MERCH RACK</h2><p class="sub">Every outfit is a real North Star piece. Wear it in the game, get the real one in the store.</p><img class="wide" src="images/society-shirts.webp" alt="North Star shirts">' +
      '<ul class="rows">' + [['NORTHTOWN DOVE TEE', 'Balanced'], ['DOPESQUE 702 TEE', 'Runs faster'], ['BATTLE BORN 2015 TEE', 'One extra hit'], ['NORTH STAR BANDANA', 'Pulls in coins'], ['NORTH STAR FLAG CAPE', 'Glides']]
        .map(([n, p]) => `<li><span>${n}<small>${p}</small></span><a class="btn" href="${MERCH_URL}" target="_blank" rel="noopener">GET IT ↗</a></li>`).join('') + '</ul>');
  } else if (o.id === 'trophy') {
    const b = load('ns-best-v1') || {}, s = load('ns-society-v1');
    openPanel('<h2>TROPHY WALL</h2><p class="sub">' + (b.time ? 'Your best run.' : 'Beat Chapter 1 to fill this wall.') + '</p><div class="stats">' +
      `<div>MASTERS<b>${b.masters ?? 0}/7</b></div><div>BEST TIME<b>${b.time ? mmss(b.time) : '--'}</b></div><div>COINS<b>${b.coins ?? '--'}</b></div></div>` +
      `<ul class="rows"><li><span>SOCIETY CARD<small>${s && s.member ? 'Member No. ' + String(s.member).padStart(4, '0') : s ? 'Member' : 'Not a member yet'}</small></span></li>` +
      '<li><span>SHARE CARD<small>Your Instagram Story card lives here</small></span></li></ul>');
  } else if (o.id === 'crew') {
    const c = CREW[o.crew];
    openPanel(`<h2>${c.name}</h2><p class="sub">${c.role}</p><ul class="rows"><li><span>ON NORTH STAR<small>${c.note}</small></span></li></ul>`);
  } else if (o.id === 'console') {
    openPanel('<h2>MIXING BOARD</h2><p class="sub">Where NORTH STAR got made. Studio sessions and BTS clips can play here.</p>');
  } else if (o.id === 'booth') {
    openPanel('<h2>VOCAL BOOTH</h2><p class="sub">Freestyles, demos and alternate takes from the mixtape can live here.</p>');
  }
}

/* ---------- update ---------- */
const SPEED = 82;
function update(dt) {
  if (!panelEl.hidden) { actPressed = false; return; }
  const dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  if (dx || dy) {
    P.face = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    const n = dx && dy ? Math.SQRT1_2 : 1;
    const nx = { x: P.x + dx * SPEED * n * dt, y: P.y, w: P.w, h: P.h }; if (!blocked(nx)) P.x = nx.x;
    const ny = { x: P.x, y: P.y + dy * SPEED * n * dt, w: P.w, h: P.h }; if (!blocked(ny)) P.y = ny.y;
    P.step += dt;
    const cols = R.map[0].length;   // walking out an open doorway
    if (P.x > cols * T - 2 || P.x < -P.w + 2) { const d = R.things.find(o => o.door); if (d) enter(d.door.to, d.door); }
  } else P.step = 0;
  if (actPressed) { actPressed = false; const o = facing(); if (o) useThing(o); }
}

/* ---------- drawing (placeholder shapes; the Higgsfield room art replaces these) ---------- */
function rect(c, x, y, w, h) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function txt(s, x, y, c = '#f3ead8', size = 6, align = 'center') { ctx.font = size + 'px ' + FONT; ctx.textAlign = align; ctx.textBaseline = 'top'; ctx.fillStyle = '#000'; ctx.fillText(s, x + 0.5, y + 0.5); ctx.fillStyle = c; ctx.fillText(s, x, y); }
function star(cx, cy, r, c) { ctx.fillStyle = c; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.42 : r; ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } ctx.fill(); }
let t = 0;
function drawRoom() {
  const rows = R.map.length, cols = R.map[0].length;
  for (let ty = 0; ty < rows; ty++) for (let tx = 0; tx < cols; tx++) {
    const x = tx * T, y = ty * T;
    if (R.map[ty][tx] === '#') {
      rect(ty < 3 ? (ty === 2 ? '#2a2352' : '#1d1840') : '#0c0a1c', x, y, T, T);
      if (ty === 2) { rect('#3a3270', x, y + 13, T, 3); }
      if (ty === 0) rect('#141130', x, y, T, 4);
    } else {
      rect((tx + ty) % 2 ? (room === 'hq' ? '#14112b' : '#1a1410') : (room === 'hq' ? '#17132f' : '#1f1813'), x, y, T, T);
      rect('rgba(255,204,51,.05)', x, y, T, 1);
    }
  }
  if (room === 'hq') {   // rug with the North Star emblem
    ctx.globalAlpha = 0.9; rect('#1d3fbf', 10 * T, 7 * T, 8 * T, 5 * T); rect('#ffcc33', 10 * T + 3, 7 * T + 3, 8 * T - 6, 1); rect('#ffcc33', 10 * T + 3, 12 * T - 4, 8 * T - 6, 1);
    star(14 * T, 9.5 * T, 22, '#f3ead8'); ctx.globalAlpha = 1;
  }

function glowIf(o) { const f = facing(); return f === o; }

function drawMiles() {

  rect('#ffcc33', cx - 2, fy - 18 + bob, 4, 1);    // chain
  rect('#7a4a2a', cx - 4, fy - 28 + bob, 8, 8);    // head

  if (P.face === 'down') { rect('#000', cx - 3, fy - 24 + bob, 2, 2); rect('#000', cx + 1, fy - 24 + bob, 2, 2); }

function render() {

  txt(room === 'hq' ? 'NORTH STAR HQ' : 'THE STUDIO', 6, 5, '#a99bc2', 5, 'left');

/* ---------- loop ---------- */
enter('hq');
window.__hq = { P, get room() { return room; }, facing: () => facing() && facing().label };
let last = performance.now();
